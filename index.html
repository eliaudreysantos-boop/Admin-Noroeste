<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#003F72" />
  <title>Noroeste — Admin</title>
  <link rel="stylesheet" href="/src/style.css" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>
<body>

  <!-- ── Login overlay ──────────────────────────────────────────────────── -->
  <div id="loginOverlay">
    <div id="loginBox">
      <h1>Noroeste</h1>
      <p class="subtitle">Sistema de gestão congregacional</p>

      <div class="form-group">
        <label class="form-label" for="selectUsuario">Usuário</label>
        <select
          id="selectUsuario"
          class="form-select"
          disabled
        >
          <option value="">Carregando…</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="inputSenha">Senha</label>
        <input
          id="inputSenha"
          class="form-input"
          type="password"
          autocomplete="current-password"
          placeholder="••••••"
        />
      </div>

      <p id="loginError"></p>

      <button id="btnEntrar" class="btn btn-primary btn-full">
        Entrar
      </button>
    </div>
  </div>

  <!-- ── App shell ──────────────────────────────────────────────────────── -->
  <div id="appShell" class="hidden">

    <main id="appContent"></main>

    <nav id="bottomBar">
      <button
        id="btnBack"
        class="bottom-nav-btn hidden"
        type="button"
        title="Voltar"
      >← Voltar</button>
      <span id="bottomBrand">NOROESTE</span>
      <span id="bottomUser"></span>
      <span class="bottom-nav-spacer"></span>
      <button id="btnSair" class="bottom-nav-btn bottom-nav-exit" type="button" title="Sair">Sair</button>
    </nav>

    <div id="statusBar">Conectando…</div>
  </div>

  <!-- ── Toast ──────────────────────────────────────────────────────────── -->
  <div id="toast"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
